<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explore Your Path — DegreeFlow</title>
<meta name="description" content="See your degree as a living map. Change a major, add a minor or move university, and watch the whole path respond." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="home.css" />
<link rel="stylesheet" href="explore.css" />
</head>
<body class="explore-page">



<div class="bg-field" aria-hidden="true">
  <span class="ribbon"></span>
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
  <span class="orb orb-d"></span>
  <span class="orb orb-e"></span>
</div>
<div class="grain-layer" aria-hidden="true"></div>

<a class="skip" href="#explore">Skip to content</a>

<header class="nav-wrap">
  <nav class="nav" id="nav" aria-label="Primary">
    <a class="brand" href="index.html">
      <img class="brand-mark-fallback" src="images/DegreeFlow_logo.png" alt="" aria-hidden="true" width="70" height="50"/>
      
      <span class="brand-name">DegreeFlow</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Open menu">
      <span></span><span></span>
    </button>

    <div class="nav-links" id="navLinks">
      <a href="index.html" class="nav-link">Home</a>
      <a href="problem-solution.html" class="nav-link">Problem &amp; Solution</a>
      <a href="index.html#how" class="nav-link">How It Works</a>
      <a href="explore.html" class="btn btn-primary btn-sm magnetic is-active" aria-current="page">Explore Your Path <span class="arrow">→</span></a>
    </div>
  </nav>
</header>

<main id="explore">

  <section class="explore-head">
    <div class="shell">
      <h1 class="ex-title"><span class="grad-word">Explore</span> Your Path</h1>
      <p class="ex-sub">Change one decision and watch your entire degree respond.</p>
      <p class="ex-state" id="exState"></p>
    </div>
  </section>

  <section class="tabs-section">
    <div class="shell">
      <div class="tabs-scroll">
        <div class="tabs" role="tablist" aria-label="Scenario" id="tabs">
          <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
          <button class="tab" role="tab" id="tab-current"    aria-selected="true"  aria-controls="view" data-scenario="current">Current Path</button>
          <button class="tab" role="tab" id="tab-major"      aria-selected="false" aria-controls="view" data-scenario="major">Switch Major</button>
          <button class="tab" role="tab" id="tab-minor"      aria-selected="false" aria-controls="view" data-scenario="minor">Add a Minor</button>
          <button class="tab" role="tab" id="tab-university" aria-selected="false" aria-controls="view" data-scenario="university">Change University</button>
        </div>
      </div>
    </div>
  </section>

  <section class="work">
    <div class="shell">

      <!-- sits above the panel so the dropdown row keeps its full width -->
      <div class="config-bar" id="configBar">
        <button class="btn btn-ghost btn-sm" id="resetBtn" type="button" hidden>↺ Reset path</button>
      </div>

      <div class="config" id="config">
        <div class="config-fields" id="configFields"></div>
        <div class="config-actions">
          <button class="btn btn-primary magnetic" id="buildBtn" type="button">Build My Path <span class="arrow">→</span></button>
        </div>
      </div>

      <div class="view" id="view" role="tabpanel" aria-labelledby="tab-current"></div>

    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer class="footer">
  <div class="shell footer-inner">
    <a class="brand" href="index.html">
            <img class="brand-mark-fallback" src="images/DegreeFlow_logo.png" alt="" aria-hidden="true" width="70" height="50"/>

      <span class="brand-name">DegreeFlow</span>
    </a>
    <nav class="footer-links" aria-label="Footer">
      <a href="index.html">Home</a>
      <a href="problem-solution.html">Problem &amp; Solution</a>
      <a href="index.html#how">How It Works</a>
    </nav>
    <p class="footer-note">Prototype · illustrative course data</p>
  </div>
</footer>

<script src="explore.js"></script>
</body>
</html>
